[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backoffice-agent"
version = "1.0.0"
description = "Autonomous Back-Office AI Agent for HR, Accounting, and Sales with Human-in-the-Loop Approvals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langgraph>=0.2.30",
    "langchain-core>=0.3.0",
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
gemini = ["langchain-google-genai>=2.0.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
